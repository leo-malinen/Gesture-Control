[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airwave"
version = "1.0.0"
description = "Local computer vision gesture and sound control. No cloud, no telemetry."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["gesture", "mediapipe", "computer-vision", "accessibility", "hands-free"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Adaptive Technologies",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    "mediapipe>=0.10.9,<0.11",
    "opencv-python>=4.8,<6",
    "numpy>=1.24,<3",
    "PyYAML>=6.0,<7",
    "PyAutoGUI>=0.9.54,<1",
    "sounddevice>=0.4.6,<1",
]

[project.optional-dependencies]
speech-fast = ["vosk>=0.3.44"]
speech-accurate = ["faster-whisper>=1.0"]
macos = ["pyobjc-framework-Quartz>=10.0", "pyobjc-framework-Cocoa>=10.0"]
dev = ["pytest>=8.0"]

[project.scripts]
airwave = "airwave.cli:main"

[tool.setuptools.packages.find]
include = ["airwave*"]

# The hub's HTML/CSS/JS are data files, not modules — without this an installed
# copy serves 404s for everything but the Python.
[tool.setuptools.package-data]
"airwave.ui.hub" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ is on the path so fixtures can be imported by name in test modules.
pythonpath = [".", "tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:google.*"]

[tool.ruff]
line-length = 118
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # dataclass field defaults read fine here
    "SIM108",  # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
